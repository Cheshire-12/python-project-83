[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page Analyzer project on Flask"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "validators>=0.35.0",
]

[dependency-groups]
dev = [
    "pook>=2.1.6",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
