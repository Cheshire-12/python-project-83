<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор страниц</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header class="bg-dark py-1">
        <div class="container">
            <div class="row">
                <div class="col-auto">
                    <a href="{{ url_for('index')}}" class="text-white text-decoration-none">Анализатор страниц</a>
                </div>
                <div class="col-auto">
                    <a href="{{ url_for('get_urls') }}" class="text-secondary text-decoration-none">Сайты</a>
                </div>
            </div>
        </div>
    </header>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <main class="flex-grow-1 container my-5">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="border-top py-3 bg-white mt-auto">
        <div class="container text-center text-muted">
            <span>Hexlet 2026</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
